name: Install supplied Petal Notes icon
on:
  push:
    branches: [main]
    paths:
      - '.icon-input/**'
      - '.github/workflows/build-petal-icon.yml'

permissions:
  contents: write

jobs:
  install-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Generate exact artwork in all browser and device icon sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import hashlib, base64, json

          root = Path('.')
          b64 = ''.join((root / '.icon-input' / ('part-%02d.txt' % n)).read_text().strip() for n in range(6))
          master = base64.b64decode(b64, validate=True)
          expected = '17a0ea82565b8e572ce884920deebb1c057d0e82b8ed34cd089f9b1c63373593'
          assert hashlib.sha256(master).hexdigest() == expected, 'Original user icon bytes changed in transfer'
          img = Image.open(BytesIO(master)).convert('RGB')
          assert img.size == (384, 384), 'Unexpected icon source size'
          assets = root / 'assets'
          assets.mkdir(exist_ok=True)
          (assets / 'icon-source.webp').write_bytes(master)
          for s in (16, 32, 48, 96, 180, 192, 512):
            img.resize((s,s),Image.Resampling.LANCZOS).save(assets / f'icon-{s}.png', optimize=True)

          # Separate mask-safe artwork for Android circular/rounded masks.
          # The supplied artwork is unchanged: only the scale/padding differs.
          mask = Image.new('RGB', (512,512), (20,6,15))
          inner = img.resize((400,400), Image.Resampling.LANCZOS)
          mask.paste(inner,((512-400)//2,(512-400)//2))
          mask.save(assets / 'icon-maskable-512.png', optimize=True)

          img.resize((64,64),Image.Resampling.LANCZOS).save(
              root / 'favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64)])

          path = root / 'manifest.webmanifest'
          manifest = json.loads(path.read_text())
          manifest['icons'] = [
            {'src':'./assets/icon-192.png?v=bell-bunny-1', 'sizes':'192x192', 'type':'image/png', 'purpose':'any'},
            {'src':'./assets/icon-512.png?v=bell-bunny-1', 'sizes':'512x512', 'type':'image/png', 'purpose':'any'},
            {'src':'./assets/icon-maskable-512.png?v=bell-bunny-1', 'sizes':'512x512', 'type':'image/png', 'purpose':'maskable'}
          ]
          path.write_text(json.dumps(manifest,indent=2)+'\n')
          index = root / 'index.html'
          html = index.read_text()
          assert '<link rel="manifest" href="./manifest.webmanifest">' in html
          assert '<link rel="icon" href="./assets/icon-192.png" type="image/png">' in html
          assert '<link rel="apple-touch-icon" href="./assets/icon-180.png">' in html
          html=html.replace(
            '<link rel="manifest" href="./manifest.webmanifest">',
            '<link rel="manifest" href="./manifest.webmanifest?v=bell-bunny-1">'
          )
          html=html.replace(
            '<link rel="icon" href="./assets/icon-192.png" type="image/png">',
            '<link rel="icon" href="./favicon.ico?v=bell-bunny-1" sizes="any" type="image/x-icon">\n'
            '  <link rel="icon" href="./assets/icon-16.png?v=bell-bunny-1" sizes="16x16" type="image/png">\n'
            '  <link rel="icon" href="./assets/icon-32.png?v=bell-bunny-1" sizes="32x32" type="image/png">\n'
            '  <link rel="icon" href="./assets/icon-192.png?v=bell-bunny-1" sizes="192x192" type="image/png">'
          )
          html=html.replace(
            '<link rel="apple-touch-icon" href="./assets/icon-180.png">',
            '<link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png?v=bell-bunny-1">'
          )
          index.write_text(html)
          print('SUCCESS: source verified and all icon formats generated')
          PY
      - name: Commit new icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico assets/icon-source.webp assets/icon-*.png manifest.webmanifest index.html
          git diff --cached --quiet || git commit -m "Install user-supplied bunny bell icon for browser and home screens"
          git push
